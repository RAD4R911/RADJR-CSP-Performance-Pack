[PHYSICS_EXPERIMENTS]
; Physics experiments
; ; module: Experiments;DESCRIPTION=Experimental tweaks which, once tested, will stop being optional.;SHORT_DESCRIPTION=Experimental tweaks;ORDER=-10
EXTENDED_PHYSICS=0 ; Use extended physics for all cars and tracks; 1 or 0
STALLING=0 ; Allow cars to be stalled (very basic experiment, currently available to cars without some custom physics scripts. Assign button in controls settings, or just use the throttle pedal if nothing is assigned. Cars with damaged engines might have difficulties starting); 1 or 0
ENABLE_MESH_COLLIDER_SOONER=1 ; Enable cars mesh collider sooner (activates proper car-ground collisions when car is not driving straight, but might reduce performance. Also might break some mods. Can be changed live); 1 or 0
CLAMP_MESH_COLLIDERS=0 ; Clamp car mesh colliders (solves possible issues with enabling car mesh colliders sooner by making sure mesh collider meshes don’t go below box colliders used for car-track collisions); 1 or 0; only with ENABLE_MESH_COLLIDER_SOONER
EXTEND_COLLIDER_BOXES=1 ; Extend car box colliders (prevents cars from falling through the ground in when falling fast); 1 or 0
EXTRAPOLATE_STATE=1 ; Extrapolate car state properly (helps to smooth out things like motion blur, resolves shaking produced by custom camera motion and more); 1 or 0
DISABLE_AUTOBRAKING=0 ; Stationary behavior (for now you’ll have to hold brakes or handbrake to prevent car from rolling away); 0 for "Original (car freezes short time after stopping)", 2 for "Adapted (car freezes after any pedals or steering were used)", 3 for "Auto-braking (replace original freezing behavior with a brakes engagement)", 1 for "Realistic (you’ll have to use handbrake to remain stationary)"
AWAKE_IN_PITS=2 ; Awake physics in pits (if car is awake, changes in setup are easier to track. Fully dynamic mode disables tyres grip entirely while holding the car in place for even more accurate setup process); 0 for "Disabled", 1 for "Awake", 2 for "Fully dynamic"
; EXTRA_CONTACT_POINTS2=0 ; Extra contact points (adds extra lateral contact points to cars with extended physics, improves handling on curbs); 1 or 0
PHYSICS_SHADOWS=0 ; Consider sun shadows (reduces road temperature in shadows based on current weather conditions); 1 or 0 
POSTPONE_WALLS_INIT=1 ; Do not wait for walls to be ready (during loading, at some point CSP pauses and waits for physics surfaces to get ready. They have to be ready for AI spline and spawn points to load properly, but it only applies to horizontal surfaces, not to the walls. With this option active, CSP will only wait for horizontal surfaces and let walls to load later.); 1 or 0; new
ALT_DEPTH_FOR_CAR_BOX_VS_TRACK=0 ;; hidden
TOE_ROD_THING=0 ;; hidden
DIFF_THING=0 ;; hidden
PRECISE_TRANSPONDER=1 ; Precise transponders (measure lap times with 1 ms precision); 1 or 0; new
ARM_FIRST_LAP=1 ; Start counting first lap when crossing the starting line on hotlap spawns in practice sessions too; hidden
__HINT_BOTTOM=Affects offline races only, and only cars with custom physics active. Once tested and finalized, might be moved to be active everywhere by default.

[OTHER_EXPERIMENTS]
; Other experiments (once tested, will be removed as options)
; ; module: Experiments;DESCRIPTION=Experimental tweaks which, once tested, will stop being optional.;SHORT_DESCRIPTION=Experimental tweaks;ORDER=-10
HIGHBEAMS_FLASHING=1 ; Flash with high beams without low beams (flash binding in AC, or using low beams button without headlights active, won’t turn on all headlights, just high beams. Might be incompatible with some cars. Online, requires a server requiring a build 3336 or above.); 1 or 0
IMPROVED_MODIFIERS_HANDLING=1 ; Improved keyboard modifiers logic (change state of modifiers, such as Ctrl, Shift or Alt, only if main button is not pressed); 1 or 0
ALT_LOGGER=1 ; Alternate logger (replaces AC logger with a custom non-blocking implementation); 1 or 0
ADAPTIVE_PERF_METER=1 ; Adaptive performance meter (increase number of performance samples used to compute delta on long tracks); 1 or 0; new
NEW_GHOST_RECORDING=1 ; High precision ghost (1 ms precision for ghost recording and playback); 1 or 0; new
__HINT_BOTTOM=With both physics and these other experiments, if activating them breaks something, please <url="https://t.me/x4fab">report the issue</url> before they’ll be activated by default.

[PHYSICS_EXPERIMENTS_DONE]
; hidden
; enabled everywhere now:
SLIDING_FIX=1 ;; hidden
BRAKES_LIMIT=1 ;; hidden
RIM_COLLISION=1 ;; hidden
SMOOTH_COLLISIONS=1 ;; hidden
ADAPTIVE_HARD_COLLISIONS=1 ;; hidden
OPTIMIZE_ROTATION=1 ;; hidden
ODE_AFTER_GRAPHICS=1 ;; hidden
SMOOTH_CONTROLS_LOCKING=1 ;; hidden
RANDOMIZE_WHEEL_ANGLES=1 ;; hidden
CUSTOM_POBJECTS_MOTION=1 ;; hidden
ALTERNATIVE_OPTIMAL_BRAKE=1 ;; hidden
REPAIR_WHEELS=1 ;; hidden ; Repair wheel joints (forces wheels back to their neutral position when mislocated. Can’t be changed live); 1 or 0
FIX_GROUND_COLLIDERS=1 ;; hidden ; Fix ground colliders (prevents cars from falling through ground, but might reduce performance. Can’t be changed live); 1 or 0
FIX_SURFACE_TYPES=1 ;; hidden ; Fix surface types of some modded tracks (some tracks have wrongly named meshes. The correct naming scheme is “<digits><surfaceType>[more digits][the rest]”, but some tracks miss out on “more digits” and as a result the surface ends up recognized as a wall); 1 or 0
FIX_SPAWN_POINTS=1 ;; hidden ; Fix missing or misplaced spawn points (cars will spawn in pits); 1 or 0

TYRE_SHIFT_SURFACE_PROPERLY=1 ; Alternative surface noise application (affects off-track surfaces with sinusoidal noise); 1 or 0
TYRE_SINE_ALTERS_NORMALS=1 ; Shift normals with sine surface noise (lets sinusoidal to alter surface normals as well); 1 or 0
TYRE_PERLIN_SURFACE_NOISE=1 ; Perlin surface noise (replaces sinusoidal noise used by some off-track surfaces with Perlin noise. Affects dirt-additive surfaces only); 1 or 0
ALT_COLLISIONS_HANDLING=1 ; New collision handling (pretty much the same, but once tested, can be improved further); 1 or 0
ALT_COLLISIONS_PROCESSING=1 ; New collisions check logic (should be smoother and more accurate); 1 or 0
PARALLELIZED_CONTACTS=1 ; Parallelized contacts search (lets ODE to check for contacts while waiting for cars physics to be computed, might decrease late physics frames); 1 or 0

[HOLDING_HANDBRAKE]
; Holding handbrake
; ; module: Input: Control Tweaks
ENABLED=0 ; Enable holding handbrake; 1 or 0
DELAY=3 ; Activation delay; from 0 s to 10, round to 0.1
SPEED_THRESHOLD=0.5 ; Speed threshold (speed should be lower than this threshold when holding handbrake for it to activate); from 0.5 km/h to 20, round to 0.5
AUTO_DISENGAGE=0 ; Disengage automatically with gas pedal; 1 or 0 
__HINT_BOTTOM=After stopping, hold handbrake for a specified time to keep it engaged until handbrake is used again.

