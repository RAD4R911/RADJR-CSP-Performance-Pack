[OPTIMIZATIONS]
; General optimizations
; ; module: Optimizations;DESCRIPTION=Some options to speed up the game. Once properly tested, some of them stop being optional.;SHORT_DESCRIPTION=Various optimizations;ORDER=-10
MULTITHREADED_LOADING=1 ; Multithreaded loading (reduces loading times); 1 or 0
SMOOTHER_LOADING=1 ; Smoother loading (disable if takes too long); 1 or 0
CACHE_CSP_CONFIGS=1 ; Cache CSP configs (stores parsed configs on disk in binary format for faster subsequent loading); 1 or 0
ASYNC_CONFIG_TEXTURES=1 ; Load textures for CSP configs in parallel (might mess up some mods); 1 or 0; new
; CACHING_LOADING2=1 ; Cache AC data to speed up loading; 1 or 0; hidden
SKIP_CREATING_SETUP_FOLDERS=1 ; Skip creating setup folders for every installed track (by default AC creates setup folders for every installed track, but with this option it would only create a folder for a track that is currently being used); 1 or 0; hidden
; AABB_REFLECTIONS2=1 ; Use SIMD-accelerated AABB culling for reflections (reduces draw calls lowering CPU and GPU load); 1 or 0
AABB_TRACKS=1 ; Use SIMD-accelerated culling for tracks (saves a bit of CPU time, might increase GPU load); 1 or 0
FORCE_CULL_TESTS=1 ; Force cull tests (might decrease GPU load by adding some extra CPU load); 1 or 0
; ADVANCED_CULLING2=1 ; Advanced culling (runs in separate thread taking into account track occluders and more); 1 or 0
; EARLY_CULL_CHECK=0 ; Check orientation-based culling early (slightly reduces draw calls, might cause flicker on CPUs with two cores); 1 or 0; only with ADVANCED_CULLING
; ADVANCED_MASKING_CULLING2=0 ; Masking culling (allows tracks to set custom masking meshes covering other objects); 1 or 0; only with ADVANCED_CULLING
; ADVANCED_MASKING_CULLING_RESOLUTION=256 ; Higher values for more accurate culling, but more expensive preparation step; hidden
; CACHE_ACS=1 ; Cache AC memory layout (improves loading speed); 1 or 0; hidden
; USE_FMM_KN5_2=0 ; Speed up KN5 loading (removes a single textures copying step, broken at the moment); hidden
; CUSTOM_SKINNED_BS2=1 ; Custom bounding spheres for skinned meshes (improves CPU and GPU performance a bit); 1 or 0
; MERGE_DIGITAL_LEDS2=1 ; Optimize series of digital LEDs (makes things like 100 RPM segments cost like one in runtime for both preparation and rendering); 1 or 0 
; PREVENT_CREATING_UNNECESSARY2=1 ; Prevent creating unnecessary entities (disable if you want to start a race with CSP tyre smoke, later disable it and see original AC smoke); 1 or 0
; VIRTUAL_REPLAYS_ALLOCATION2=1 ; Virtual replays allocation (can prevent short freezes on replays reallocation); 1 or 0
WIC_TEXTURES_LOADING=1 ; New loader for PNG and JPEG textures (use Windows Imaging Component framework for more accurate and faster loading of textures in PNG and JPEG format); 1 or 0; new

[OPTIMIZATIONS_CPU]
; CPU optimizations
; ; module: Optimizations
USE_CHUNKS=2 ; Chunks optimization (removes distant objects from scene to save time on having to check if they’re close enough or not each time the scene is being rendered. Advanced mode currently might hide too much in replays or with low FOV cameras.); 0 for Disabled, 1 for Basic, 2 for Advanced
; LIMIT_GENERAL2=1 ; Limit some things if there are a lot of cars; 1 or 0
; LIMIT_SHADOWS2=1 ; Limit shadows; 1 or 0
; LIMIT_SMOKE2=3 ; Limit smoke (set to 0 to disable limit); from 0 to 5, round to 1
LIMIT_AUDIO=25 ; Limit audio (set to 0 to disable limit); from 0 to 50, round to 1
LIMIT_AUDIO_FOR_OTHER_CARS=0 ; Limit audio for other cars (skips loading of interior audio events and such, experimental); 0 for Disabled, 1 for Online only, 2 for Always
POSTPONABLE_OPTIONALS=1 ; Delay optional stuff to smooth out frame times (for example, skip grass regeneration for a frame if there is a high risk of lag in the current frame); 1 or 0
HYPERTHREADING_FIX=0 ; Apply hyperthreading fix (spread workload across cores for CPUs with hyperthreading to try and improve performance); 1 or 0
; PAUSE_HIDDEN_APPS2=1 ; Pause hidden apps (affects only a few known apps which are safe to pause like that); 1 or 0

[OPTIMIZATIONS_GPU]
; GPU optimizations (can reduce GPU load in certain situations depending on view, track or cars)
; ; module: Optimizations
OPTIMIZE_MESHES=1 ; Optimize meshes; 1 or 0
DEDUPLICATE_MESHES=1 ; Deduplicate meshes (reduces VRAM usage for multiple cars of same type); 1 or 0
DEDUPLICATE_TEXTURES=1 ; Deduplicate textures (reduces VRAM usage); 1 or 0
; SHADOW_MAP_16BIT4=0 ; Half-precision shadow maps (possibly not worth it); 1 or 0
; USE_NEW_DDS_LOADER2=1 ; Use newer DDS loader (much faster textures loading, also might reduce VRAM consumption); hidden
UPGRADE_TEXTURES=0 ; Upgrade AC textures (increases size taken by AC folder a lot, but might improve loading time and VRAM consumption); 1 or 0
; BC7_CACHE2=1 ; Compress cached textures (applies BC7 compression to cached textures, mostly affects billboards of 3D trees); 1 or 0
; QUERY_BASED_MAPPING2=1 ; Use queries for mapping GPU resources (improves responsiveness of some of rendering aspects, such as auto-exposure with YEBIS replacement); 1 or 0
__HINT_BOTTOM=None of these would affect visual quality at all, optimizations just mean more efficient arrangement of things to utilize GPU better. ;; hidden

[NEW_KN5_LOADER]
; New KN5 loader (slightly faster, reduces RAM and VRAM consumption a bit)
; ; module: Optimizations
; ENABLED2=1 ; Active; 1 or 0
SHARED_MATERIALS=2 ; Shared KN5 materials; 0 for Disabled, 1 for Across the same model, 2 for Across the same cars
SHARED_MESHES=1 ; Shared KN5 meshes; 1 or 0
COMPRESSED_MESHES=1 ; Compress shared meshes; 1 or 0; only with SHARED_MESHES
SKIP_OVERLY_DETAILED=1 ; Skip meshes hidden by video settings (changing world detail while the game is running won’t work entirely well); 1 or 0
STRIP_PHYSICS_DATA=1 ; Strip unnecessary data from physics meshes; 1 or 0
LAZY_TEXTURES_LOADING=0 ; Lazy textures loading (experimental, might lead to missing textures or even crashes); 1 or 0
KN5_STREAMING=1 ; Allow KN5 streaming (generates cache files on first launch, but speeds up subsequent launches; works on configured tracks only, experimental); 1 or 0; new

[GHOST_RECORDER]
; Hotlap tweaks
; ; module: Simulation: Hotlap & Ghost;DESCRIPTION=Tweaks for ghost and hotlap mode.;SHORT_DESCRIPTION=Hotlap mode extensions;ORDER=-1.8
HAUNTED_HOUSE=1 ; Multiple ghosts (store few best records with extra information to choose from in-game); 1 or 0; new
HAUNTED_COMPATIBLE=1 ; Compatible mode (mirror best ghost record to where AC stored ghosts originally so that software expecting those would still work. For CSP to distinguish between mirrored and proper ghosts, it adds an “Archive” tag to them.); 1 or 0; new
SAVE_PERF_METER=3 ; Save performance data with ghost (used to compute delta); 0 for disabled, 1 for across restarts, 3 for across restarts and sessions; new
SAVE_BEST_LAPTIME=3 ; Save best lap time with ghost (not available if RSR or similar app is present); 0 for disabled, 1 for across restarts, 3 for across restarts and sessions; new
SAVE_TELEMETRY=1 ; Save comparative telemetry with ghost across sessions (shown in main menu); 1 or 0; new
__HINT_BOTTOM=More settings can be changed in-game.

[GHOST]
; Ghost visual tweaks
; ; module: Simulation: Hotlap & Ghost
USE_ORIGINAL_MATERIALS=0 ; Use original car look instead of semi-transparent glowing one; 1 or 0; not available with ADD_EXTRA_GLOW
SIMPLIFY_GHOST_MODEL=1 ; Optimize ghost model (improves FPS and loading speed, especially if ghost is changing live); 1 or 0; new
ADD_EXTRA_GLOW=0 ; Add extra glow to the ghost; 1 or 0; hidden with USE_ORIGINAL_MATERIALS
EXTRA_GLOW_EMISSIVE_MULT=1 ; Extra glow, emissive mult.; from 0 to 2, perc.; hidden with not ADD_EXTRA_GLOW or USE_ORIGINAL_MATERIALS
EXTRA_GLOW_LIGHT_MULT=1 ; Extra glow, light mult.; from 0 to 2, perc.; hidden with not ADD_EXTRA_GLOW or USE_ORIGINAL_MATERIALS
REFRACTION_MULT=0 ; Refraction; from 0 to 2, perc.; hidden with USE_ORIGINAL_MATERIALS
CAST_SHADOWS=0 ; Cast shadows; 1 or 0

[SHARED_MEMORY]
; Shared memory tweaks
REDUCE_GFORCES_WHEN_SLOW=0 ; Reduce G-forces for cars slower than 6 km/h (improves D-BOX behavior); 1 or 0

[DEV]
; Developer settings
; ; module: Other: Developer;DESCRIPTION=Developer settings. Don’t change unless you know what you’re doing and reading the descriptions. Available only if developer mode in CM is enabled (you might need to restart CM after activating it to see these).;SHORT_DESCRIPTION=Developer tweaks;DEVELOPER=1
WATCH_FOR_CHANGES=1 ; Watch configs for changes; 1 or 0
USE_PARTIAL_RELOAD=1 ; Use partial reload for track and car configs (for those settings where it’s possible); 1 or 0
DETAILED_CRASHES=0 ; Produce detailed crashes (larger files, but more useful for debugging); 1 or 0
SILENT_LUA=0 ; Prevent Lua scripts from outputting debug data (unless Lua debug app has been used in a few previous sessions); 1 or 0
KEEP_BACKGROUND_WORKERS_AROUND=0 ; Keep Lua workers for (time to keep keep Lua background workers in Lua Debug app after they’re finished); from 0 s to 60, round to 1
FLAMES_ALWAYS_ON=0 ;; hidden
TRACK_CONDITIONS_RESTORE=0  ; set to 1 to stop lights from getting smoothly lit up when configs are changed; hidden
D3D_DEBUG=0 ; Debug rendering (makes everything incredibly slow, requires DirectX SDK); 1 or 0 
GRACEFUL_START=3 ; skips rendering scene for the first N frames to make it easier for GPU to start; hidden
DISABLE_STEAM_INTERFACE=0 ; Disable Steam interface; 1 or 0
LUA_APPS_DIR=lua ;; hidden
COUNT_LUA_MEMORY=0 ;; hidden
FORCE_LUA_PREPROCESSOR=1 ;; hidden
DISABLE_AUDIO=0 ; Disable audio; 1 or 0
DISABLE_TEXTURES=0 ; Disable textures; 1 or 0
BC7_COMPRESSION_LEVEL=3  ; BC7 compression level; from 0 to 6
LAZY_CLOUDS_GENERATION=1 ; Lazy clouds generation; 1 or 0
LAZY_MIPS_GENERATION=1 ; Lazy MIPs generation; 1 or 0
PROFILE_LOADING=0 ; Profile loading; 1 or 0
PROFILE_MEMORY=0 ; Profile memory; 1 or 0
PROFILE_FREEZES_THRESHOLD=30 ; value in milliseconds for frames to show up; hidden
DISABLE_PROCESS_JOBS=0 ;; hidden
NANORT_SCENE_RAYCAST=0 ; Accelerate mesh-ray checks (speeds up raycasting used by Lua API or by apps such as Objects Inspector or Photo App’s click-to-focus, consumes around 50 MB of RAM per 1 million of triangles); 1 or 0
DX_DEVICE_PRIORITY=7 ;; hidden
; EXTRACT_RESOURCES=C:/Temp/Resources
; SHADERS_DIR=C:/Temp/compiled_shaders
FMOD_LOGGING=0 ;; hidden
SAFE_EXIT=1 ; Safe exit (try disabling if AC isn’t saving something properly on exit, but it might mess up exiting process in other ways); 1 or 0
CRASH_ON_F12=0 ; Crash AC on Ctrl+Shift+Alt+Win+F12 (if AC freezes, press Ctrl+Shift+Alt+Win+F12 to crash it and get a dump); 1 or 0
DISABLE_AI_SMOOTH_STEERING=0 ;; hidden
HANDLE_ALT_COMMANDS=1 ; Fix system beeps on Alt+… shortcuts by handing such messages; hidden
PREVENT_SLEEP=2 ; Keep Windows active (adds a small flag to AC window asking Windows to stay awake while the window is opened); hidden; "Disabled" is 0, "Ensure screen is on (default)" is 1, "Disable sleep" is 2; new; not available with COMPATIBILITY/OLD_WINDOW
CONSIDER_OCCLUDED_FLAG=1 ; Consider DXGI’s occluded state (if Windows tells AC it’s not visible — usually happens when PC is asleep — pause rendering); 1 or 0
__HINT_BOTTOM=Please be extra careful with these settings.

[THREAD_TWEAKS]
; Threads timing (how to pace graphics and physics frames, use carefully)
; ; module: Other: Developer;DEVELOPER=1
RENDER_TIMING=2 ; Timing for render loop; Spin is 0, Sleep+Spin is 1, Sleep is 2, Timer is 3, "High Resolution Timer (requires Windows 10)" is 4
PHYSICS_TIMING=2 ; Timing for physics loop; Yield is 0, Timer+Yield+Spin is 1, Sleep is 2, Timer is 3, "High Resolution Timer (requires Windows 10)" is 4
PROCESS_PRIORITY=1 ; Adjust process priority (might help to outrun Discord); Default is 0, Above normal is 1, High priority is 2; new
PHYSICS_MAXIMUM_PRIORITY=1 ; Use ultimate thread priority for physics; 1 or 0; new
__HINT_BOTTOM=On my PC, Timer seems to be the best.

[QOS_TWEAKS]
; hidden
; Weird tweaks for outgoing UDP traffic. Look for `[QOS]` in logs to see how this one is doing.
BASE_TOS_FLAG=0 ; Adds a basic TOS flag. Use 184 for “Voice / low-latency” traffic, or 104 for high priority. Seems like it’s ignored on modern Windows.
QWAVE_CFG=0 ; Use QWAVE (Quality Windows Audio/Video Experience) to boost traffic. Experimental.
QWAVE_TYPE=5 ; Value of QOS_TRAFFIC_TYPE to use. For possible values, see <https://learn.microsoft.com/en-us/windows/win32/api/qos2/ne-qos2-qos_traffic_type>.
QWAVE_NON_ADAPTIVE=1 ; Use QOS_NON_ADAPTIVE_FLOW flag (seems like it’s a good fit for AC).
QWAVE_DSCP_VALUE=46 ; Try to override DSCP directly. This setting requires the calling application be a member of the Administrators or the Network Configuration Operators group.

