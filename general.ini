[ℹ]
FULLNAME=General settings
PREVIEW=https://acstuff.club/images/modules/general.jpg
DESCRIPTION=Some patch settings which aren’t related to any specific extensions.
SHORT_DESCRIPTION=Miscellaneous
ORDER=-10.1
LIVE_SUPPORT=0

[BASIC]
; Shaders Patch
ENABLED=1 ; Active (set to 0 to disable everything completely); 1 or 0

; [DRIVE]
; ; Driving tweaks
; PREFER_DISABLED_ABS2=0 ; Keep ABS disabled even if server forces it on (can be switched back on during the race with Ctrl+A as usual); 1 or 0
; PREFER_DISABLED_TC2=0 ; Keep TC disabled even if server forces it on (can be switched back on during the race with Ctrl+T as usual); 1 or 0

[CONFIGURATIONS]
; System settings
USE_MMF=1 ; Microsoft Media Foundation (use Microsoft Media Foundation for playing videos and additional audio in-game. Note: disabling this option might break some Lua apps, scripts and visual effects.); 1 or 0; new
; IGNORE_CACHE2=0 ; Ignore cached data (things like precalculated ambient shadows from cars, cars rain occlusion data or tree normals alignment; disabling would slow down loading, but would make it easier to prepare certain configs); hidden
CRASH_PLUGIN=0 ; Use separate process for crash messages (experimental, ensures AC would shut down before showing an error message. In VR, always active.); 1 or 0
CLEAR_SHADERS_CACHE=1 ; Clear shaders cache when CSP version changes (helps with game freezing when loading or exiting); 1 or 0
CLEAR_CSP_CACHE=1 ; Clear CSP cache when CSP version changes (doesn’t remove upgraded textures or cars data, but clears out some other things); 1 or 0
; CREATE_TRACK_MAP=0 ; Create track map if missing; 1 or 0; hidden
; CUSTOM_FILE_WATCHING=1 ; Custom file watching (alternative implementation for AC monitoring changes in files, such as digital instruments); 1 or 0; hidden
; REDIRECT_MMF_THROUGH_FMOD=0 ; Redirect media players audio through FMOD (experimental, disabled by default for now, will be always enabled soon); 1 or 0
; PRECREATE_MMF_DEVICE=1 ; Initialize extra D3D instance for MMF (might help if the initial moment of loading a video freezes AC); 1 or 0
HTTP_DISABLE_FLAGS= ; TLS, DECOMPRESS, NB_CALLBACKS, HTTP2, IPV6_FAST_FALLBACK, DISABLE_STREAM_QUEUE, NO_GLOBAL_POOLING, TLS_FALSE_START, TCP_FAST_OPEN, HTTP3, HTTP3_HANDSHAKE_TIMEOUT ; hidden
ADAPTER_NAME= ; Internet adapter name (if you have multiple internet connections and want to choose a specific one for AC, specify its name or IP address here. List multiple connections separated by a comma to fallback from the first one further if it’s not available. If value can be parsed as IP, it’ll be used as IP, otherwise it’ll be used as a filter matching with an adapter, where “?” matches with any number of symbols, so, for example, “Wi-Fi?” would match any adapter with a name starting with “Wi-Fi”. You can also use filters such as “wifi:yes”, or, for example, “{ wifi:no & ip:192.? }”. Currently, only IPv4 is supported here. Details about search are written in CSP log. If no matching adapters are found, default one will be used. If you’re creating a service running as a child process, IP address of selected adapter should be available as “ACCSP_PREFERRED_ADAPTER_IP” environment variable.);
LOOPBACK_SERVERS=0 ; Loopback servers (AC starts two servers, one for extra commands and another for telemetry, triggering Windows Firewall. With this checkbox, they would become loopback servers, available only for software running from this machine, slightly improving loading speed and hiding unnecessary distractions); 1 or 0; new
FILE_OP_HOOK=C:/Users/illvd/source/repos/csp_decrypt_example/x64/Release/cspdecryptexample.dll, FileOpHook ;; hidden

[CONTROL]
; Controls
; ; module: Input: Control Tweaks;DESCRIPTION=Various input adjustments.;SHORT_DESCRIPTION=Various inputs adjustments;ORDER=-1.899
; FIX_ORDER2=1 ; Automatically fix controls order; hidden
; RELOAD_ON_FOCUS=1 ; Automatically reload control settings (reload would only happen once AC unpauses, not during the driving. Changing input type live is not currently supported); 1 or 0
RELEASE_DPAD=0 ; Stop AC from using D-Pad in quick pits menu; 1 or 0
; QPM_FIX_WINGS2=1 ; Fix wings in quick pits menu (show setup value rather than wing angle for easier and more clear configuration); 1 or 0
UNBIND_TURBO_DIGITS=0 ; Stop digits from changing turbo setting; 1 or 0
UNBIND_GAMEPAD_SHORTCUT=1 ; Unbind Ctrl+P; 1 or 0
ALTERNATIVE_AI_DRIVER=1 ; Tweak autopilot switching (with this option AI driver becomes more active and can be switched off); 1 or 0 
AI_DRIVER_KEEP_SETTINGS=1 ; Stop autopilot from altering car settings; 1 or 0; only with ALTERNATIVE_AI_DRIVER
; DISCORD_HOOK_FIX2=1 ; Fix for Discord overlay (might stop Discord overlay from crashing AC); hidden
IGNORE_ESCAPE_IN_REPLAYS=0 ; Ignore Escape button in replays (by default it stops a replay, but it can also be stopped with Alt+F4, for example); 1 or 0
; INACTIVE_ONLY_WHEN_COVERED2=2 ; Foreground check (specify how to check if AC window is in background or in foreground); 0 for "Use foreground flag (not recommended, might misbehave)", 1 for "Check if the middle of AC window is covered", 2 for "Check if most of AC window is covered (recommended)"
; BINARY_MODIFIERS_FILTERING2=1 ; Check for modifier buttons in other bindings (allows to bind A+B for one command and B for another, and then pressing A+B won’t trigger B command); 1 or 0

[CONTROL_MOUSE_STEERING]
; Keyboard & mouse tweaks
; ; module: Input: Keyboard & Mouse;DESCRIPTION=A few tweaks for mouse steering. Plus, an option to redefine its logic with a script.;SHORT_DESCRIPTION=Mouse steering tweaks;ORDER=-1.9
RESTORE_MOUSE_POSITION=1 ; Restore original mouse position (restore mouse position when pausing mouse steering); 1 or 0; new
USE_RAW_INPUT=0 ; Use raw input for mouse steering (not sure if it would be any better or not); 1 or 0; hidden with IS_LIVE__
TOGGLE_WITH_MIDDLE_BUTTON=0 ; Use middle mouse button to toggle mouse steering; 1 or 0
USE_SCRIPT=0 ; Use script (allows to alter or replace default logic with a custom Lua script); 1 or 0
IMPLEMENTATION=base ; Script; look for assist.lua in extension/lua/mouse-steering; only with USE_SCRIPT

[CONTROL_MOUSE_STEERING_SETTINGS]
; Mouse steering script settings
; ; module: Input: Keyboard & Mouse
__PLUGIN_SETTINGS=CONTROL_MOUSE_STEERING/IMPLEMENTATION, extension/state/lua/joypad_assist/{0}__settings.ini ;; hidden

[CAR_CAMERAS]
; Car cameras
; ; module: Camera: General;DESCRIPTION=Some general cameras tweaks.;SHORT_DESCRIPTION=Camera tweaks;ORDER=-1.0001
ALLOW_BUMPER=1 ; Allow bumper camera; 1 or 0
ALLOW_BONNET=1 ; Allow bonnet camera; 1 or 0
ALLOW_COCKPIT=1 ; Allow cockpit camera; 1 or 0
ALLOW_DASHBOARD=1 ; Allow dashboard camera; 1 or 0
ALLOW_CHASE_1=1 ; Allow first chase camera; 1 or 0
ALLOW_CHASE_2=1 ; Allow second chase camera; 1 or 0
; USE_TRAJECTORIES_FOR_START_CAMERA=1 ; Use showroom camera trajectories for starting camera (trajectories can be configured in Custom Showroom, look for “Follow trajectory” in “Camera settings” tab); 1 or 0
FOV_BUMPER=60 ; Bumper camera FOV; from 20° to 160
SHAKING_BUMPER=0, 0 ; Bumper camera shaking (horizontal and vertical, set 1 for a regular gentle shaking or above for a more pronounced effect); 2 values: "from 0 to 10, perc."
FOV_BONNET=60 ; Bonnet camera FOV; from 20° to 160
SHAKING_BONNET=0, 0 ; Bonnet camera shaking (horizontal and vertical, set 1 for a regular gentle shaking or above for a more pronounced effect); 2 values: "from 0 to 10, perc."

[ORBIT_CAMERA]
; Orbit/F5 camera
; ; module: Camera: General
FIX_SPEED=1 ; Rotation speed (set to 0 to use original speed which depends on FPS); from 0 to 5, perc.; new
CAPTURE_MOUSE=0 ; Capture cursor in-place when rotating; 1 or 0; new
RMB_FOR_ROTATING=0 ; Rotate camera with right mouse button (more similar to free camera, and allows to drag things around with F5 camera); 1 or 0; new

[TRACK_CAMERAS]
; Track cameras
; ; module: Camera: General
FORCE_DISABLE_WOBBLE=0 ; Disable camera wobble; 1 or 0

[MISC_CAMERAS]
; Miscellaneous options
; ; module: Camera: General
RAW_INPUT=0 ; Use raw input for mouse-based cameras (affects first person, free and orbit cameras, as well as walking-out camera); 1 or 0
RAW_INPUT_SPEED=2 ; Raw input speed; from 0 to 5, per.; hidden with ! RAW_INPUT
RESTORE_POSITION=1 ; Restore position for captured cursors (affects first person, free and orbit cameras, as well as walking-out camera); 1 or 0

[AUDIO]
; Audio tweaks
; ; module: Simulation: Audio;DESCRIPTION=Distance delay, geometry-based occlusion & reverb and more.;SHORT_DESCRIPTION=Various audio tweaks;ORDER=-1.8
DECOMPRESS_SAMPLES=0 ; Decompress samples (reduces CPU overhead for content with compressed audio samples in exchange for higher RAM usage); 1 or 0
ALTER_PITCH_IN_SLOW_MOTION=1 ; Alter pitch in slow motion; 1 or 0
; OLD_MASTER_SOUNDBANK=content/sfx/old/common.bank ;; file
; ALIGNMENT_FIX=1 ; Fix listener orientation (in some specific cases, like, for example, when using F5 non-orbit camera and pressing right mouse button, listener orientation might break in strange ways); 1 or 0; hidden
; VR_FIX=1 ; Fix stereo sound in VR; 1 or 0; hidden
; GEARS_FIX=1 ; Fix missing gears sound with frequent shifting; 1 or 0; hidden
DISTANCE_DELAY=0 ; Add sound delay with distance; 1 or 0
DISABLE_BRAKES_SOUND=0 ; Disable brakes sound; 1 or 0
DISABLE_TC_SOUND=0 ; Disable traction control sound; 1 or 0
OPPONENTS_EXTRA_MULT=1 ; Opponents volume mult.; from 0 to 3, perc.
USE_INTERIOR_SOUNDS=0 ; Use interior sounds everywhere; 1 or 0
USE_EXTERIOR_SOUNDS=2 ; Mix in exterior sounds (smart option adds exterior audio for cars without a roof, excluding open-wheelers); 0 for "Original behavior", 1 for "Always (without interior sounds)", 4 for "Always (with interior)", 2 for Smart; not available with USE_INTERIOR_SOUNDS
ALTER_REVERB_AMOUNT=1.0 ; Reverb multiplier; from 0 to 1, perc; visible with USE_EXTERIOR_SOUNDS=4
USE_EXTERIOR_SKIDS=0 ; Use exterior skid sounds (temporary tweak if you prefer that set of samples more); 1 or 0; not available with USE_EXTERIOR_SOUNDS=1
USE_ACTUAL_THROTTLE=1 ; Use actual throttle value (throttle component will be affected by shift-related cutoffs or the throttle curve); 1 or 0
USE_ACTUAL_BRAKE=1 ; Use actual brakes value (take ABS into account); 1 or 0; new
ADJUSTED_SKIDS=1 ; Slightly more accurate skids audio (pause when wheel is not sliding or touching the ground); 1 or 0; new
ADJUSTED_WIND=1 ; Alter wind audio (reinterprets audio input “air_pressure” differently to better highlight slipstream effect and improve overall logic, if you notice any car mods which sound worse please report them); 1 or 0; new
WIND_FROM_OTHER_CARS=1 ; Wind audio from other cars (based on speed difference); from 0 to 2, perc.; new
QUIET_WHEN=IDLE ; Silence audio; NONE for Never, MINIMIZED for when minimized, IDLE for when idling in background, BACKGROUND for when in background
; CUSTOM_UPDATE2=1 ; Might be faster, doesn’t work with track audio occluders, but most tracks don’t have those to begin with; hidden
; OCCLUDE_AUDIO2=1 ; Use track occluders to occlude audio as well (for tracks with configured track visibility occluders); 1 or 0
FORCE_REVERB=-1 ; Original track reverb; -1 for default, 0 for fully deactivate
DO_NOT_TINKER_WITH_REVERB=0 ; Do not alter reverb (Stop CSP from using second reverb channel or using non-default reverb values entirely); 1 or 0;n ew
ALTER_REVERB=1 ; Adjust AC reverb (adds reverb to collision events and more, adds a tiny bit of reverb to reverbless audio events); 1 or 0; hidden with DO_NOT_TINKER_WITH_REVERB
SPATIAL_REVERB=0 ; Geometry-based reverb (very experimental); from 0 to 1, perc.
ADDITIONAL_REVERB=1 ; Add extra reverb (adds more reverb with distance or for audio occluded by walls for configured tracks); 1 or 0; hidden with DO_NOT_TINKER_WITH_REVERB
EXTENDED_AMBIENCE=1 ; Alter ambience audio (changes ambience track based depending on conditions. Experimental, loads audio samples from a cloud. More samples are coming soon.); 1 or 0
SHIFTED_AMBIENCE=1 ; Reposition original AC ambience (might help with performance a bit); 1 or 0
ALTER_DAMAGED_ENGINE_AUDIO=1 ; Slightly tweak audio for damaged engines; 1 or 0
SILENCE_MALFUNCTIONS=1 ; Silence malfunctioning FMOD channels (tries to silence AC to prevent audio glitches preceeded by silence that sound like explosions. Temporary solution until a proper fix will be found, although it does sound a bit like an FMOD malfunction, fixing which could be trickier); 1 or 0
SILENCE_MALFUNCTIONS_THRESHOLD=500 ;; hidden
FMOD_FLAGS=4 ; 524288: dolby mix, 131072: vol0 optimization, 1024/512: distant audio tweaks, second is lowpass, 256: RAM savings; hidden
FMOD_STUDIO_FLAGS=0 ; Try 4 for sync update; hidden

